services:
  # Backend Express API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tentree-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # JWT Authentication
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      # Google Drive Storage (optional - falls back to local fs if not set)
      - GOOGLE_CLIENT_EMAIL=${GOOGLE_CLIENT_EMAIL}
      - GOOGLE_PRIVATE_KEY=${GOOGLE_PRIVATE_KEY}
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID}
      # NetSuite Integration (optional)
      - NETSUITE_ACCOUNT_ID=${NETSUITE_ACCOUNT_ID}
      - NETSUITE_CONSUMER_KEY=${NETSUITE_CONSUMER_KEY}
      - NETSUITE_CONSUMER_SECRET=${NETSUITE_CONSUMER_SECRET}
      - NETSUITE_TOKEN_ID=${NETSUITE_TOKEN_ID}
      - NETSUITE_TOKEN_SECRET=${NETSUITE_TOKEN_SECRET}
    volumes:
      # Persist JSON data and uploads
      - ./backend/data:/app/data
    networks:
      - tentree-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {if(r.statusCode!==200)throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Next.js App
  frontend:
    build:
      context: ./frontend/tentree-scportal
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:5000}
    container_name: tentree-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tentree-network

  # Nginx Reverse Proxy (SSL termination)
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: tentree-nginx
    restart: unless-stopped
    ports:
      - "443:443" # HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/opt/nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx:rw
    depends_on:
      - frontend
    networks:
      - tentree-network

networks:
  tentree-network:
    driver: bridge
